name: 毎日のブログ記事を生成（GitHub Actions 版）

# Vercel Cron（vercel.json + /api/cron/generate-post）の代わりに GitHub Actions で回す場合に使う。
# 両方を同時に有効にしない（二重投稿になる）。
#
# 毎日1本を必ず出す仕組みではない。毎朝、生成を試み、品質チェック（機械の検査＋読み直し）に通ったときだけ
# content/blog に保存して push する。通らなかった日は何も保存せず、緑のまま終わる。
#
# 必要な Secrets: ANTHROPIC_API_KEY
# 任意の Secrets: ANTHROPIC_MODEL（記事を書くモデル。既定は Haiku）
#                  ANTHROPIC_REVIEW_MODEL（公開前の読み直しに使うモデル。既定は書くモデルより上のモデル）
# ANTHROPIC_API_KEY が未登録の間は、警告を出して何もせずに終わる（失敗にはしない）。

on:
  schedule:
    # 日本時間 毎朝 10:20（UTC 01:20）
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ファイルを書かずに、生成される記事の内容だけ確認する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # シークレットが無いときは失敗にせず、警告を出して終わる
      # （Vercel Cron の側で動かしているリポジトリで、毎朝このワークフローが赤くならないように）
      - name: APIキーの確認
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::シークレット ANTHROPIC_API_KEY が未設定のため、記事の生成をスキップしました。GitHub Actions で自動投稿するには、Settings → Secrets and variables → Actions に登録してください。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: steps.key.outputs.ready == 'true'

      - name: 記事を生成
        if: steps.key.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_REVIEW_MODEL: ${{ secrets.ANTHROPIC_REVIEW_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run blog:generate

      # 保存する前に、公開済みの全記事を同じ品質ゲートで点検する（問題のある記事が1本でもあれば push しない）
      - name: 公開前の点検
        if: ${{ steps.key.outputs.ready == 'true' && !inputs.dry_run }}
        run: npm run blog:audit

      - name: コミットして push
        if: ${{ steps.key.outputs.ready == 'true' && !inputs.dry_run }}
        run: |
          git config user.name "solar-shift-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/blog
          if git diff --cached --quiet; then
            echo "新しい記事はありません（品質基準を満たす記事ができなかった日は、ここで終わります）。"
            exit 0
          fi
          git commit -m "blog: 記事を追加"
          # 生成のあいだに main が進んでいても push できるように、先に取り込む
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
